name: Short Observation Quality
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['short/**', 'scripts/short/**', 'tests/short/**', 'requirements-short.txt', '.github/workflows/short-quality.yml']
  push:
    branches: ['feature/short-observation-v1']
    paths: ['short/**', 'scripts/short/**', 'tests/short/**', 'requirements-short.txt', '.github/workflows/short-quality.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: python -m pip install -r requirements-short.txt
      - name: Frozen long-side strategy regression
        run: python -m unittest tests.test_strategy_regression -v
      - name: Isolated short tests and both-market source regression
        run: python -m unittest discover -s tests/short -p 'test_*.py' -v
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: node --test tests/tracking-quality.node.mjs
      - run: npm --prefix short ci --ignore-scripts
      - run: npm --prefix short test
      - name: Full Python suite with explicit known-data baseline report
        run: python -m scripts.short.check_legacy
