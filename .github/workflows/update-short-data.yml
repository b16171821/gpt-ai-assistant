name: Update Independent Short Observation Data
on:
  workflow_dispatch:
    inputs:
      research:
        description: 'Also refresh the labelled historical technical research'
        type: boolean
        default: false
  schedule:
    - cron: '50 7 * * 1-5'
    - cron: '45 22 * * 1-5'
    - cron: '15 4 * * 0'
permissions:
  contents: read
concurrency:
  # Share the existing data-write queue without changing any legacy workflow.
  group: stock-data-main
  cancel-in-progress: false
jobs:
  update-short-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-short.txt
      - uses: actions/cache@v4
        with:
          path: data/short/cache
          key: short-history-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: short-history-v1-${{ runner.os }}-
      - name: Verify frozen legacy code before any update
        run: python -m unittest tests.short.test_legacy_isolation tests.test_strategy_regression -v
      - name: Update independent closing data
        id: scan
        continue-on-error: true
        run: python -m scripts.short.run_update
      - name: Refresh official historical indexes and research
        if: inputs.research == true || github.event.schedule == '15 4 * * 0'
        run: |
          python -m scripts.short.index_history
          python -m scripts.short.backtest
      - name: Short data and lifecycle checks
        run: python -m unittest discover -s tests/short -p 'test_*.py'
      - name: Publish only independent short artifacts
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/short
          if ! git diff --cached --quiet; then
            git commit -m 'Update independent short observation data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report incomplete update without disguising old data
        if: steps.scan.outcome == 'failure'
        run: |
          echo '::error::Short update incomplete; last-good prices and original dates were retained. Inspect data/short/health.json and status files.'
          exit 1
