name: Update Visitor Statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: stock-data-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.GA4_PROPERTY_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check report configuration
        id: config
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'GA4 report credentials are not configured; update skipped.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.11'
      - name: Install report-only dependencies
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install 'google-auth[requests]>=2.40,<3'
      - name: Sync main
        if: steps.config.outputs.ready == 'true'
        run: git pull --ff-only origin main
      - name: Export aggregate count
        if: steps.config.outputs.ready == 'true'
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/update_site_visitors.py
      - name: Publish public statistics only
        if: steps.config.outputs.ready == 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data/site_visitors.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update aggregate visitor statistics'
            git push origin HEAD:main
          fi
