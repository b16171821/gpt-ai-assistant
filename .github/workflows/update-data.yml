name: Update Stock Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_tw_stock_scanner.py'
      - 'scripts/tw_official_data.py'
      - 'scripts/update_us_stock_scanner.py'
      - 'scripts/market_filter.py'
      - 'scripts/update_strategy_tracking.py'
      - 'scripts/update_strategy_snapshots.py'
      - 'scripts/disposition_service.py'
      - 'scripts/update_disposition_risk.py'
      - 'scripts/check_data_health.py'
      - 'scripts/update_tracking_context.py'
      - 'scripts/update_tracking_quality.mjs'
      - 'tracking-quality.js'
      - 'tests/test_disposition_service.py'
      - 'tests/test_disposition_data.py'
      - 'tests/test_strategy_tracking.py'
      - 'tests/test_tw_official_data.py'
      - 'tests/test_us_data_freshness.py'
      - 'tests/test_data_health.py'
      - 'tests/test_strategy_regression.py'
      - 'tests/fixtures/strategy-sample.json'
      - 'STRATEGY_GUARD.md'
      - '.github/workflows/update-data.yml'
  schedule:
    # 台股首次更新：台灣時間 14:40，週一～週五
    - cron: '40 6 * * 1-5'
    # 台股補跑：台灣時間 15:40，週一～週五
    - cron: '40 7 * * 1-5'
    # 美股收盤後更新：台灣時間 06:40，週二～週六
    - cron: '40 22 * * 1-5'

permissions:
  contents: read

concurrency:
  group: stock-data-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance pandas numpy twstock
      - name: Sync latest main before scanning
        run: git pull --ff-only origin main
      - name: Run scanners and follow-up updates
        run: |
          set -o pipefail
          python scripts/update_tw_stock_scanner.py 2>&1 | tee tw-scanner.log || {
            message="$(tail -n 12 tw-scanner.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=台股官方收盤更新失敗::$message"
            exit 1
          }
          python scripts/update_us_stock_scanner.py 2>&1 | tee us-scanner.log || {
            message="$(tail -n 12 us-scanner.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=美股完整收盤更新失敗::$message"
            exit 1
          }
          python scripts/update_disposition_risk.py
          python scripts/update_company_profiles.py
          python scripts/update_strategy_locks.py
          python scripts/update_strategy_snapshots.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/update_strategy_tracking.py
          python scripts/update_tracking_context.py
          node scripts/update_tracking_quality.mjs
          python scripts/check_data_health.py --output data/data_health.json
      - name: Commit data files
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data
          if git diff --cached --quiet; then
            echo no-changes
          else
            git commit -m update-data
            git push
          fi
