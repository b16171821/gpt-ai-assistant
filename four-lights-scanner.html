<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阿波五燈交易系統 1.0</title>
  <style>
    body{font-family:Arial,'Noto Sans TC',sans-serif;margin:0;background:#0f172a;color:#e5e7eb}.wrap{max-width:1180px;margin:auto;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}button,input,textarea{border-radius:10px;border:1px solid #475569;background:#020617;color:#e5e7eb;padding:10px;font-size:14px}button{cursor:pointer;background:#2563eb;border:0;font-weight:700}button.secondary{background:#374151}.muted{color:#94a3b8}.lights{display:flex;gap:6px;flex-wrap:wrap}.light{padding:4px 8px;border-radius:999px;font-size:12px;background:#334155}.on{background:#16a34a}.wait{background:#854d0e}.off{background:#475569}.unknown{background:#1e293b;border:1px dashed #64748b}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border-bottom:1px solid #334155;padding:10px;text-align:left;font-size:14px}th{color:#cbd5e1;background:#1e293b}.pill{border-radius:999px;padding:3px 8px;font-size:12px}.ok{background:#166534}.wait{background:#854d0e}.avoid{background:#7f1d1d}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.note{line-height:1.7}.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{background:#020617;border:1px solid #334155;border-radius:12px;padding:10px 12px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>阿波五燈交易系統 1.0</h1>
  <p class="muted">這一頁只讀取已經算好的 <span class="mono">data/latest.json</span>。勝率：尚未回測。</p>
  <div class="card topbar">
    <button onclick="loadLatest()">讀取最新掃描結果</button>
    <button onclick="filterStored()">依目前設定篩選已儲存結果</button>
    <button class="secondary" onclick="exportCSV()">匯出目前畫面 CSV</button>
    <span id="updatedAt" class="muted">尚未讀取</span>
  </div>
  <div class="card">
    <h2>篩選已儲存結果</h2>
    <p class="muted">下面的按鈕不會重新下載股價，也不會重算五燈。它只依你填的門檻，從這次已儲存的燈號裡挑出來。</p>
    <div class="grid">
      <label>至少通過燈數<input id="minLights" type="number" value="3" min="0" max="5"></label>
      <label>只看強勢股候選標籤<input id="strongOnly" type="checkbox"></label>
      <label>最多顯示檔數<input id="limit" type="number" value="50"></label>
    </div>
  </div>
  <div class="card">
    <h2>結果</h2>
    <div class="topbar"><div id="summary" class="stat">尚未讀取</div><div id="qualified" class="stat">勝率：尚未回測</div></div>
    <div style="overflow:auto"><table id="resultTable"><thead><tr><th>代號</th><th>名稱</th><th>收盤</th><th>評級</th><th>五燈</th><th>位置</th><th>標籤</th></tr></thead><tbody></tbody></table></div>
  </div>
  <div class="card note"><h2>資料從哪裡來</h2><p>台股掃描只由 <span class="mono">Update Stock Data</span> 發布。舊的 15:40 第二條掃描流程不再寫入檔案，避免兩次結果互相覆蓋。</p></div>
</div>
<script src="apo-five-lights.js?v=20261122-five-lights"></script>
<script>
let stocks=[];let lastResults=[];
function num(v){const n=parseFloat(String(v??'').replace(/,/g,''));return Number.isFinite(n)?n:0}
function lightClass(light){if(!light)return 'unknown';if(light.state==='通過')return 'on';if(light.state==='等待')return 'wait';if(light.state==='未核實')return 'unknown';return 'off'}
function lightsHtml(row){const lights=Array.isArray(row.lights)?row.lights:[];if(!lights.length)return '<span class="light unknown">未核實</span>';return `<div class="lights">${lights.map(light=>`<span class="light ${lightClass(light)}">${light.name||''} ${light.state||''}</span>`).join('')}</div>`}
function cls(rating){if(rating==='待執行名單')return 'ok';if(rating==='高優先觀察'||rating==='觀察')return 'wait';return 'avoid'}
function render(results){lastResults=results;const tb=document.querySelector('#resultTable tbody');tb.innerHTML='';results.forEach(r=>{tb.insertAdjacentHTML('beforeend',`<tr><td class="mono">${r.code||''}</td><td>${r.name||''}</td><td>${r.close??''}</td><td><span class="pill ${cls(r.rating)}">${r.rating||'未核實'}</span></td><td>${lightsHtml(r)}</td><td>${r.priceLocation||'-'}</td><td>${(r.tags||[]).join('、')||'-'}</td></tr>`)});document.getElementById('summary').textContent=`已儲存 ${stocks.length} 檔，畫面顯示 ${results.length} 檔`;document.getElementById('qualified').textContent='勝率：尚未回測'}
function filterStored(){const minLights=num(document.getElementById('minLights').value);const limit=num(document.getElementById('limit').value)||50;const strongOnly=document.getElementById('strongOnly').checked;const results=stocks.filter(r=>{if(r.strategySystem!=='apo-five-lights-1.0')return false;if(num(r.lightsPassed)<minLights)return false;if(strongOnly&&!(r.tags||[]).includes('強勢股候選'))return false;return true}).sort((a,b)=>num(b.lightsPassed)-num(a.lightsPassed)||num(b.riskRewardRatio)-num(a.riskRewardRatio)).slice(0,limit);render(results)}
async function loadLatest(){try{const res=await fetch('data/latest.json?ts='+Date.now());if(!res.ok)throw new Error('latest.json not found');const payload=await res.json();stocks=payload.stocks||[];const fresh=payload.meta?.strategySystem==='apo-five-lights-1.0';document.getElementById('updatedAt').textContent=(fresh?'五燈資料 ':'舊四燈資料，畫面不另評分 ')+(payload.meta?.updatedAt||'');filterStored()}catch(e){document.getElementById('updatedAt').textContent='讀取失敗：'+e.message;stocks=[];render([])}}
function exportCSV(){if(!lastResults.length){alert('沒有結果可匯出');return}const headers=['date','code','name','close','rating','lightsPassed','priceLocation'];const rows=[headers.join(',')].concat(lastResults.map(r=>headers.map(h=>`"${String(r[h]??'').replace(/"/g,'""')}"`).join(',')));const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='five_lights_filtered.csv';a.click()}
loadLatest();
</script>
</body>
</html>
